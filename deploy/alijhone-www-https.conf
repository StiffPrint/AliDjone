server {
    listen 443 ssl;
    http2 on;
    server_name www.alijhone.store;
    ssl_certificate /etc/letsencrypt/live/alijhone.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alijhone.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / { return 301 https://alijhone.store$request_uri; }
}
